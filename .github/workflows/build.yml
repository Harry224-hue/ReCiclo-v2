name: Compilar y Validar ReCiclo Web

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar Linting (ESLint)
        run: npm run lint

      - name: Compilar aplicación Web (TypeScript & Vite)
        run: npm run build

      - name: Subir artefacto compilado (dist)
        uses: actions/upload-artifact@v4
        with:
          name: reciclo-web-dist
          path: dist/
          retention-days: 14
