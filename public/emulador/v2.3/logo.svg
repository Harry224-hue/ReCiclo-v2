<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 42" fill="none">
  <defs>
    <linearGradient id="recicloGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="leafFill" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.55" />
    </linearGradient>
    <style>
      .wordmark-ciclo {
        fill: #09090b;
      }
      @media (prefers-color-scheme: dark) {
        .wordmark-ciclo {
          fill: #ffffff;
        }
      }
    </style>
  </defs>

  <!-- Bio-Loop R Emblem -->
  <g transform="translate(1, 1) scale(0.40)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 28 82 
             L 28 40 
             C 28 22, 42 14, 58 14 
             C 74 14, 84 25, 84 42 
             C 84 57, 72 66, 54 66 
             L 42 66 
             C 52 66, 60 71, 66 77 
             L 74 84" 
          stroke="url(#recicloGrad)" 
          stroke-width="8" />
    <path d="M 46 58 
             C 41 46, 44 32, 58 22 
             C 69 32, 68 47, 56 56 
             C 52 59, 48 59, 46 58 Z" 
          fill="url(#leafFill)" 
          stroke="url(#recicloGrad)" 
          stroke-width="4.5" />
    <path d="M 48 56 C 52 44, 55 34, 57 24" 
          stroke="#ffffff" 
          stroke-width="2.6" 
          stroke-opacity="0.9" />
  </g>

  <!-- Typography Wordmark -->
  <text x="43" y="30" font-family="Urbanist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" letter-spacing="-0.5px">
    <tspan fill="#10b981" font-weight="800">Re</tspan><tspan class="wordmark-ciclo" font-weight="700">Ciclo</tspan>
  </text>
</svg>